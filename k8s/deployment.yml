apiVersion: v1
kind: Namespace
metadata:
  name: boxing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: boxing-config
  namespace: boxing
data:
  APP_NAME: "Boxing Management API"
  ENV: "production"
  LOG_LEVEL: "INFO"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_CALLS: "100"
  RATE_LIMIT_PERIOD: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: boxing-secrets
  namespace: boxing
type: Opaque
stringData:
  POSTGRES_USER: "trevor"
  POSTGRES_PASSWORD: "supersecure-change-me"
  SECRET_KEY: "your-secret-key-here"
  SENTRY_DSN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boxing-api
  namespace: boxing
spec:
  replicas: 3
  selector:
    matchLabels:
      app: boxing-api
  template:
    metadata:
      labels:
        app: boxing-api
    spec:
      containers:
      - name: api
        image: your-registry/boxing-api:latest
        ports:
        - containerPort: 8000
        env:
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: boxing
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: boxing-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: boxing-secrets
              key: POSTGRES_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: boxing-secrets
              key: SECRET_KEY
        - name: REDIS_URL
          value: redis://redis:6379
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: boxing-api
  namespace: boxing
spec:
  type: LoadBalancer
  selector:
    app: boxing-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: boxing-api-hpa
  namespace: boxing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: boxing-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
